[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agnspec"
version = "0.1.0"
description = "A component-oriented package for fitting AGN optical/UV spectra."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "astropy>=5.0",
]

[project.optional-dependencies]
mcmc = ["emcee>=3.1"]
nested = ["dynesty>=2.0"]
extinction = ["dust_extinction>=1.0"]
all = ["emcee>=3.1", "dynesty>=2.0", "dust_extinction>=1.0"]

[tool.setuptools.packages.find]
include = ["agnspec*"]
